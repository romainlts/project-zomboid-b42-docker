name: pz-b42

services:
  # ---------------------------------------------------------------------------
  # Project Zomboid (Build 42) dedicated server - installed/updated by SteamCMD
  # FR : Serveur dedie Project Zomboid (Build 42) - installe/maj via SteamCMD
  # ---------------------------------------------------------------------------
  pz-server:
    build:
      context: ./server
      args:
        UID: ${PUID:-1000}
        GID: ${PGID:-1000}
    image: pz-b42-server:local
    container_name: pz-server
    restart: unless-stopped
    stop_grace_period: 120s
    stdin_open: true
    tty: true
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Paris}
      PZ_APPID: "380870"
      PZ_BRANCH: ${PZ_BRANCH:-}
      PZ_BRANCH_PASSWORD: ${PZ_BRANCH_PASSWORD:-}
      UPDATE_ON_START: ${UPDATE_ON_START:-true}
      SERVER_NAME: ${SERVER_NAME:-servertest}
      SERVER_PUBLIC: ${SERVER_PUBLIC:-false}
      SERVER_PUBLIC_NAME: ${SERVER_PUBLIC_NAME:-Mon serveur B42}
      SERVER_PASSWORD: ${SERVER_PASSWORD:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?definis ADMIN_PASSWORD dans .env}
      SERVER_MEMORY: ${SERVER_MEMORY:-6g}
      MAX_PLAYERS: ${MAX_PLAYERS:-16}
      DEFAULT_PORT: ${PZ_PORT:-16261}
      RCON_PORT: "27015"
      RCON_PASSWORD: ${RCON_PASSWORD:?definis RCON_PASSWORD dans .env}
      MOD_IDS: ${MOD_IDS:-}
      WORKSHOP_IDS: ${WORKSHOP_IDS:-}
      PZ_FORCE_INI_KEYS: ${PZ_FORCE_INI_KEYS:-}
    ports:
      - "${PZ_PORT:-16261}:16261/udp"
      - "16262:16262/udp"
      - "16263:16263/udp"
    volumes:
      - pz-install:/pz-server
      - zomboid-data:/zomboid
    # The panel only acts on containers carrying this label, and only when
    # PANEL_DOCKER_CONTROL is on. Harmless on its own: a label grants nothing.
    # FR : Le panel n'agit que sur les conteneurs portant ce label, et
    # FR : seulement si PANEL_DOCKER_CONTROL est actif. Inoffensif en soi :
    # FR : un label ne donne aucun droit.
    labels:
      zomboid-panel.managed: "true"
    networks:
      - pz-net
    healthcheck:
      # An RCON request proves the JVM runs AND the server processes commands -
      # a plain pgrep lets a frozen or GC-thrashing server pass as healthy.
      # $$RCON_PASSWORD is resolved inside the container, so the password does
      # not show up in "docker inspect".
      # FR : Une requete RCON prouve que la JVM tourne ET que le serveur traite
      # FR : les commandes - un simple pgrep laisse passer un serveur fige.
      # FR : $$RCON_PASSWORD est resolu dans le conteneur : le mot de passe
      # FR : n'apparait pas dans "docker inspect".
      test: ["CMD-SHELL", "rcon -a 127.0.0.1:$$RCON_PORT -p \"$$RCON_PASSWORD\" players >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      # first boot = Steam download + map generation
      # FR : premier boot = telechargement Steam + generation de la carte
      start_period: ${PZ_HEALTH_START_PERIOD:-900s}

  # ---------------------------------------------------------------------------
  # Web administration interface (Zomboid Control Panel)
  # FR : Interface d'administration web (Zomboid Control Panel)
  # https://github.com/fpsacha/zomboid-control-panel
  # ---------------------------------------------------------------------------
  panel:
    image: ghcr.io/fpsacha/zomboid-panel:latest
    container_name: zomboid-panel
    restart: unless-stopped
    depends_on:
      - pz-server
    ports:
      # PANEL_BIND=127.0.0.1 once Caddy is in place: the panel is then only
      # reachable through the reverse proxy.
      # FR : PANEL_BIND=127.0.0.1 quand Caddy est en place : le panel n'est
      # FR : alors plus joignable que par le reverse proxy.
      - "${PANEL_BIND:-0.0.0.0}:${PANEL_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Europe/Paris}
      PORT: "3001"
      PZ_SERVER_PATH: /pz-server
      PZ_SAVE_PATH: /zomboid
      RCON_HOST: pz-server
      RCON_PORT: "27015"
      RCON_PASSWORD: ${RCON_PASSWORD:?definis RCON_PASSWORD dans .env}
      RCON_SKIP_SERVER_CHECK: "true"
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      CORS_ORIGINS: ${PANEL_CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Lets the panel start/stop/restart the labelled container. Read the
      # warning on PANEL_DOCKER_SOCKET below before turning this on.
      # FR : Autorise le panel a demarrer/arreter/redemarrer le conteneur
      # FR : labellise. Lis l'avertissement sur PANEL_DOCKER_SOCKET avant.
      PANEL_DOCKER_CONTROL_ENABLED: ${PANEL_DOCKER_CONTROL:-false}
    volumes:
      - ./panel/data:/app/data
      - ./panel/logs:/app/logs
      # DANGER. The Docker socket is an unauthenticated root-level API: anything
      # that reaches it can create a container mounting the host filesystem, and
      # therefore take over the machine. Mounting it here means a panel
      # compromise costs you the host, not just the game server.
      # Only set PANEL_DOCKER_SOCKET when the panel is NOT reachable from the
      # Internet (SSH tunnel, or PANEL_ALLOWED_IPS restricted to your own IP).
      # Left unset, /dev/null is mounted instead and the panel finds no daemon.
      #
      # FR : DANGER. Le socket Docker est une API root sans authentification :
      # FR : qui l'atteint peut creer un conteneur montant le disque de l'hote,
      # FR : donc prendre la machine. Le monter ici signifie qu'une compromission
      # FR : du panel te coute l'hote, pas seulement le serveur de jeu.
      # FR : Ne renseigne PANEL_DOCKER_SOCKET que si le panel n'est PAS joignable
      # FR : depuis Internet (tunnel SSH, ou PANEL_ALLOWED_IPS limite a ton IP).
      # FR : Non renseigne, /dev/null est monte a la place et le panel ne trouve
      # FR : aucun demon.
      - ${PANEL_DOCKER_SOCKET:-/dev/null}:/var/run/docker.sock
      # shared access to the server files (mods, configs, logs, saves)
      # FR : acces partage aux fichiers du serveur (mods, configs, logs, saves)
      - pz-install:/pz-server
      - zomboid-data:/zomboid
    networks:
      - pz-net
    healthcheck:
      # node is necessarily present (the panel is a node app): no dependency
      # on curl/wget, which may be missing depending on the base image.
      # FR : node est forcement present (le panel est une app node) : pas de
      # FR : dependance a curl/wget, qui peuvent manquer selon l'image.
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3001/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ---------------------------------------------------------------------------
  # Scheduled backup of saves and configs -> ./backups
  # Reuses the server image (it already ships tar and the rcon client).
  # FR : Backup planifie des sauvegardes et configs -> ./backups
  # FR : Reutilise l'image du serveur (elle embarque tar et le client rcon).
  # ---------------------------------------------------------------------------
  backup:
    build:
      context: ./server
      args:
        UID: ${PUID:-1000}
        GID: ${PGID:-1000}
    image: pz-b42-server:local
    container_name: pz-backup
    restart: unless-stopped
    depends_on:
      - pz-server
    user: "${PUID:-1000}:${PGID:-1000}"
    entrypoint: ["/usr/local/bin/backup-runner.sh"]
    environment:
      TZ: ${TZ:-Europe/Paris}
      ZOMBOID_DIR: /zomboid
      BACKUP_DIR: /backups
      BACKUP_AT: ${BACKUP_AT:-04:00}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
      BACKUP_ON_START: ${BACKUP_ON_START:-false}
      RCON_HOST: pz-server
      RCON_PORT: "27015"
      RCON_PASSWORD: ${RCON_PASSWORD:?definis RCON_PASSWORD dans .env}
    volumes:
      - zomboid-data:/zomboid:ro
      - ./backups:/backups
    networks:
      - pz-net

  # ---------------------------------------------------------------------------
  # HTTPS reverse proxy in front of the panel (optional "proxy" profile)
  # FR : Reverse proxy HTTPS devant le panel (profil "proxy", optionnel)
  #   docker compose --profile proxy up -d
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: pz-caddy
    profiles: ["proxy"]
    restart: unless-stopped
    depends_on:
      - panel
    environment:
      TZ: ${TZ:-Europe/Paris}
      # domain set -> automatic HTTPS ; empty -> ":80" (local HTTP)
      # FR : domaine renseigne -> HTTPS auto ; vide -> ":80" (HTTP local)
      CADDY_SITE_ADDRESS: ${CADDY_DOMAIN:-:80}
      # Space-separated CIDRs allowed to reach the panel. The default lets
      # everyone in, which is the previous behaviour.
      # FR : CIDR autorises a joindre le panel, separes par des espaces. Le
      # FR : defaut laisse tout passer, comportement anterieur.
      PANEL_ALLOWED_IPS: ${PANEL_ALLOWED_IPS:-0.0.0.0/0 ::/0}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # certificates: must be preserved / FR : certificats : a conserver
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - pz-net

volumes:
  pz-install:
  zomboid-data:
  caddy-data:
  caddy-config:

networks:
  pz-net:
    driver: bridge
